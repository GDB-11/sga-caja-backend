spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sga_caja}
spring.datasource.username=${DB_USERNAME:admin}
spring.datasource.password=${DB_PASSWORD:1234}

# Secreto de desarrollo únicamente — sobreescribir con JWT_SECRET en cualquier entorno real.
sga.security.jwt.secret=${JWT_SECRET:dev-only-insecure-secret-change-me-1234567890abcdef}
sga.security.jwt.access-token-ttl-minutes=${JWT_ACCESS_TTL_MINUTES:30}
sga.security.jwt.refresh-token-ttl-minutes=${JWT_REFRESH_TTL_MINUTES:60}
